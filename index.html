<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quản lý tiền thuê nhà</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#e9efed;--card:#fff;--ink:#17302b;--muted:#5f736e;--line:#d3dfdb;--accent:#0e6b5b;--accent-d:#0a5245;--amber:#f0b44c;--err:#b3382c}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1040px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:1.6rem;margin:8px 0 4px;letter-spacing:-.01em}
.sub{margin:0 0 20px;color:var(--muted)}
.grid{display:grid;gap:16px;grid-template-columns:1fr}
@media(min-width:860px){.grid{grid-template-columns:1.25fr 1fr;align-items:start}.receipt{position:sticky;top:16px}}
.card{background:var(--card);border-radius:14px;padding:20px;border:1px solid var(--line)}
fieldset{border:0;margin:0 0 20px;padding:0;min-width:0}
legend{font-weight:700;margin-bottom:10px;padding:0}
.row{display:grid;gap:12px;grid-template-columns:1fr 1fr}
.full{grid-column:1/-1}
label{display:block;font-size:.88rem;color:var(--muted);margin-bottom:4px}
input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:9px;font:inherit;color:var(--ink);background:#fff}
input:focus-visible,button:focus-visible{outline:3px solid #7cc9b9;outline-offset:1px}
.hint{font-size:.85rem;margin-top:4px;color:var(--accent);font-weight:500;min-height:1.3em}
.hint.bad{color:var(--err)}
.msg{color:var(--err);font-size:.92rem;min-height:1.4em;margin:0 0 8px}
.actions{display:flex;gap:10px;flex-wrap:wrap}
button{font:inherit;font-weight:700;border-radius:10px;padding:12px 18px;cursor:pointer;border:2px solid var(--accent);flex:1 1 150px}
.primary{background:var(--accent);color:#fff}
.primary:hover:not(:disabled){background:var(--accent-d)}
.ghost{background:#fff;color:var(--accent)}
.ghost:hover:not(:disabled){background:#eef6f4}
button:disabled{opacity:.65;cursor:wait}
.receipt{background:#15302a;color:#e8f2ef;border-color:#15302a}
.receipt h2{margin:0 0 12px;font-size:1.05rem}
.empty{color:#9fb8b1;margin:0}
.line{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px dashed #3b5a52}
.line small{display:block;color:#9fb8b1}
.line b{white-space:nowrap;font-variant-numeric:tabular-nums}
.total{margin-top:14px}
.total span{color:#9fb8b1;font-size:.9rem}
.total strong{display:block;font-size:2.2rem;line-height:1.2;color:var(--amber);font-variant-numeric:tabular-nums;word-break:break-word}
</style>
</head>
<body>
<div class="wrap">
  <h1>Quản lý tiền thuê nhà</h1>
  <p class="sub">Nhập chỉ số điện nước, tính tiền và lưu hóa đơn vào Google Sheets.</p>

  <div class="grid">
    <form class="card" id="form" autocomplete="off" novalidate>
      <fieldset>
        <legend>Thông tin phòng</legend>
        <div class="row">
          <div><label for="phong">Tên phòng</label><input id="phong" placeholder="Ví dụ: P101"></div>
          <div><label for="nguoi">Tên người thuê</label><input id="nguoi" placeholder="Ví dụ: Nguyễn Văn A"></div>
          <div class="full"><label for="thang">Tháng tính tiền (MM/YYYY)</label><input id="thang" placeholder="10/2026" inputmode="numeric" maxlength="7"></div>
        </div>
      </fieldset>

      <fieldset>
        <legend>Điện</legend>
        <div class="row">
          <div><label for="dien_cu">Số điện cũ</label><input id="dien_cu" type="number" inputmode="decimal" min="0" step="any"></div>
          <div><label for="dien_moi">Số điện mới</label><input id="dien_moi" type="number" inputmode="decimal" min="0" step="any"></div>
        </div>
        <div class="hint" id="dien_hint"></div>
      </fieldset>

      <fieldset>
        <legend>Nước</legend>
        <div class="row">
          <div><label for="nuoc_cu">Số nước cũ</label><input id="nuoc_cu" type="number" inputmode="decimal" min="0" step="any"></div>
          <div><label for="nuoc_moi">Số nước mới</label><input id="nuoc_moi" type="number" inputmode="decimal" min="0" step="any"></div>
        </div>
        <div class="hint" id="nuoc_hint"></div>
      </fieldset>

      <fieldset>
        <legend>Đơn giá và các khoản khác</legend>
        <div class="row">
          <div><label for="gia_dien">Giá điện (đ/kWh)</label><input id="gia_dien" type="number" inputmode="numeric" min="0" value="3500"></div>
          <div><label for="gia_nuoc">Giá nước (đ/khối)</label><input id="gia_nuoc" type="number" inputmode="numeric" min="0" value="15000"></div>
          <div><label for="tien_phong">Tiền phòng cố định (đ)</label><input id="tien_phong" type="number" inputmode="numeric" min="0"></div>
          <div><label for="dich_vu">Tiền dịch vụ khác (đ)</label><input id="dich_vu" type="number" inputmode="numeric" min="0" placeholder="0"></div>
        </div>
      </fieldset>

      <p class="msg" id="msg" role="alert"></p>
      <div class="actions">
        <button type="button" class="ghost" id="calc">Tính tổng tiền</button>
        <button type="button" class="primary" id="save">Lưu hóa đơn</button>
      </div>
    </form>

    <aside class="card receipt" aria-live="polite">
      <h2>Hóa đơn</h2>
      <div id="receipt"><p class="empty">Nhập thông tin rồi bấm "Tính tổng tiền" để xem chi tiết.</p></div>
    </aside>
  </div>
</div>

<script>
// Đường link Web app của Google Apps Script
const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyDyHUVJjWBTTSuq61xG6d-hd1XLlZ245LkUFY_HmH6FVsEPifFh7xvW1QNdWz09LGLmQ/exec";

const $ = id => document.getElementById(id);
const num = id => parseFloat($(id).value) || 0;
const money = n => new Intl.NumberFormat("vi-VN").format(Math.round(n)) + "đ";
const qty = n => new Intl.NumberFormat("vi-VN", { maximumFractionDigits: 2 }).format(n);
const esc = s => s.replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

// Mặc định tháng hiện tại
(function () {
  const d = new Date();
  $("thang").value = String(d.getMonth() + 1).padStart(2, "0") + "/" + d.getFullYear();
})();

// Tự tính số tiêu thụ khi nhập
function updateUsage() {
  [["dien", "kWh"], ["nuoc", "khối"]].forEach(([k, unit]) => {
    const hint = $(k + "_hint");
    if ($(k + "_cu").value === "" || $(k + "_moi").value === "") { hint.textContent = ""; hint.className = "hint"; return; }
    const u = num(k + "_moi") - num(k + "_cu");
    if (u < 0) { hint.textContent = "Số mới phải lớn hơn hoặc bằng số cũ"; hint.className = "hint bad"; }
    else { hint.textContent = "Tiêu thụ: " + qty(u) + " " + unit; hint.className = "hint"; }
  });
}
["dien_cu", "dien_moi", "nuoc_cu", "nuoc_moi"].forEach(id => $(id).addEventListener("input", updateUsage));

// Kiểm tra dữ liệu và tính tiền; trả về null nếu có lỗi
function compute() {
  const msg = $("msg"); msg.textContent = "";
  const fail = t => { msg.textContent = t; return null; };

  const phong = $("phong").value.trim();
  const thang = $("thang").value.trim();
  if (!phong) return fail("Hãy nhập tên phòng.");
  if (!/^(0?[1-9]|1[0-2])\/\d{4}$/.test(thang)) return fail("Tháng tính tiền cần có dạng MM/YYYY, ví dụ 10/2026.");
  if (["dien_cu", "dien_moi", "nuoc_cu", "nuoc_moi"].some(id => $(id).value === "")) return fail("Hãy nhập đủ số điện và số nước (cũ và mới).");

  const soDien = num("dien_moi") - num("dien_cu");
  const soNuoc = num("nuoc_moi") - num("nuoc_cu");
  if (soDien < 0) return fail("Số điện mới phải lớn hơn hoặc bằng số điện cũ.");
  if (soNuoc < 0) return fail("Số nước mới phải lớn hơn hoặc bằng số nước cũ.");
  if ([num("gia_dien"), num("gia_nuoc"), num("tien_phong"), num("dich_vu")].some(v => v < 0)) return fail("Các khoản tiền không được âm.");

  const b = {
    phong, nguoi: $("nguoi").value.trim(), thang,
    dienCu: num("dien_cu"), dienMoi: num("dien_moi"), soDien,
    nuocCu: num("nuoc_cu"), nuocMoi: num("nuoc_moi"), soNuoc,
    giaDien: num("gia_dien"), giaNuoc: num("gia_nuoc"),
    tienPhong: num("tien_phong"), dichVu: num("dich_vu")
  };
  b.tienDien = soDien * b.giaDien;
  b.tienNuoc = soNuoc * b.giaNuoc;
  b.tong = b.tienPhong + b.dichVu + b.tienDien + b.tienNuoc;
  return b;
}

function render(b) {
  const row = (t, sub, v) => `<div class="line"><div>${t}${sub ? `<small>${sub}</small>` : ""}</div><b>${money(v)}</b></div>`;
  $("receipt").innerHTML =
    `<p style="margin:0 0 6px"><b>Phòng ${esc(b.phong)}</b>${b.nguoi ? " - " + esc(b.nguoi) : ""}<br><span class="empty">Tháng ${esc(b.thang)}</span></p>` +
    row("Tiền phòng", "", b.tienPhong) +
    row("Dịch vụ khác", "", b.dichVu) +
    row("Tiền điện", `${qty(b.soDien)} kWh x ${money(b.giaDien)}`, b.tienDien) +
    row("Tiền nước", `${qty(b.soNuoc)} khối x ${money(b.giaNuoc)}`, b.tienNuoc) +
    `<div class="total"><span>Tổng cộng</span><strong>${money(b.tong)}</strong></div>`;
}

$("calc").addEventListener("click", () => { const b = compute(); if (b) render(b); });

async function save() {
  const b = compute();
  if (!b) return;
  render(b);

  const payload = {
    phong: b.phong,
    nguoi_thue: b.nguoi,
    thang: b.thang,
    so_dien_cu: b.dienCu, so_dien_moi: b.dienMoi, so_dien_tieu_thu: b.soDien,
    so_nuoc_cu: b.nuocCu, so_nuoc_moi: b.nuocMoi, so_nuoc_tieu_thu: b.soNuoc,
    don_gia_dien: b.giaDien, don_gia_nuoc: b.giaNuoc,
    tien_phong: b.tienPhong, tien_dich_vu: b.dichVu,
    tien_dien: b.tienDien, tien_nuoc: b.tienNuoc,
    tong_tien: b.tong,
    ngay_gio_luu: new Date().toLocaleString("vi-VN"),
    // Các trường dưới đây khớp với script Apps Script đã tạo trước đó
    tien_thue: b.tienPhong + b.dichVu,
    ghi_chu: `Điện ${qty(b.soDien)} kWh; Nước ${qty(b.soNuoc)} khối; Dịch vụ khác ${b.dichVu}đ`
  };

  const btn = $("save");
  btn.disabled = true;
  btn.textContent = "Đang lưu...";
  try {
    // text/plain giúp tránh lỗi CORS preflight với Apps Script
    const res = await fetch(WEB_APP_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(payload)
    });
    const data = await res.json();
    if (!res.ok || data.status !== "success") throw new Error(data.message || "Phản hồi không hợp lệ");
    alert("Lưu thành công!");
  } catch (err) {
    console.error(err);
    alert("Lỗi lưu dữ liệu!");
  } finally {
    btn.disabled = false;
    btn.textContent = "Lưu hóa đơn";
  }
}
$("save").addEventListener("click", save);
</script>
</body>
</html>
